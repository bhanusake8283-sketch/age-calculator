<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit properly on mobile screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>

  <!-- Favicon (the small icon shown in the browser tab) -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#2b3cf0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <h1>Age Calculator</h1>

    <!-- Tabs: click one to switch between the two tools -->
    <div class="tabs">
      <button id="tabAge" class="tab active">My Age</button>
      <button id="tabGap" class="tab">Age Gap</button>
    </div>

    <!-- ================= TAB 1: MY AGE ================= -->
    <section id="agePanel">
      <p class="subtitle">Find out your exact age</p>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob">

      <p id="error" class="error"></p>

      <div class="buttons">
        <button id="calculateBtn" class="btn primary">Calculate Age</button>
        <button id="resetBtn" class="btn secondary">Reset</button>
      </div>

      <!-- Result (hidden until an age is calculated) -->
      <section id="result" class="result hidden">
        <h2>Your Age</h2>

        <div class="age-boxes">
          <div class="box">
            <span id="years" class="number">0</span>
            <span class="label">Years</span>
          </div>
          <div class="box">
            <span id="months" class="number">0</span>
            <span class="label">Months</span>
          </div>
          <div class="box">
            <span id="days" class="number">0</span>
            <span class="label">Days</span>
          </div>
        </div>

        <div class="totals">
          <p>Total completed months: <strong id="totalMonths">0</strong></p>
          <p>Total days elapsed: <strong id="totalDays">0</strong></p>
        </div>
      </section>
    </section>

    <!-- ================= TAB 2: AGE GAP ================= -->
    <section id="gapPanel" class="hidden">
      <p class="subtitle">Find the age gap between two people</p>

      <!-- Person A -->
      <label for="nameA">Person A name (optional)</label>
      <input type="text" id="nameA" placeholder="Person A">
      <label for="dobA" class="space">Person A date of birth</label>
      <input type="date" id="dobA">

      <!-- Person B -->
      <label for="nameB" class="space">Person B name (optional)</label>
      <input type="text" id="nameB" placeholder="Person B">
      <label for="dobB" class="space">Person B date of birth</label>
      <input type="date" id="dobB">

      <p id="gapError" class="error"></p>

      <div class="buttons">
        <button id="gapBtn" class="btn primary">Find Age Gap</button>
        <button id="gapResetBtn" class="btn secondary">Reset</button>
      </div>

      <!-- Result (hidden until the gap is calculated) -->
      <section id="gapResult" class="result hidden">
        <h2>Age Gap</h2>
        <p id="gapSentence" class="sentence"></p>

        <div class="age-boxes">
          <div class="box">
            <span id="gapYears" class="number">0</span>
            <span class="label">Years</span>
          </div>
          <div class="box">
            <span id="gapMonths" class="number">0</span>
            <span class="label">Months</span>
          </div>
          <div class="box">
            <span id="gapDays" class="number">0</span>
            <span class="label">Days</span>
          </div>
        </div>

        <div class="totals">
          <p>Total gap in days: <strong id="gapTotalDays">0</strong></p>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
